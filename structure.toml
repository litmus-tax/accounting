# Module map for litmus.accounting: the source of truth for scripts/structure.py.
# Layers are top-level packages (root modules are layers named by their stem);
# each lists the layers it may import. `layering = N` records that issue N
# tracks a module's import violations (its import check is skipped);
# `split_pending = N` records that issue N tracks splitting it past max_lines.

package = "litmus.accounting"
src = "pkg/src/litmus/accounting"
max_lines = 400

[layers]
model = []
codec = ["model"]
schema = ["codec"]
pricing = ["model"]
engine = ["engine", "model", "pricing"]
cli = ["codec", "schema", "engine", "model", "pricing"]
__init__ = ["engine", "pricing"]

[modules]
"__init__.py" = { doc = "Exposes `calculation` and `pricing` as package attributes." }
"model.py" = { doc = "Frozen-dataclass ledger input (events, legs, links, liabilities, policy) and output records; the one schema for library, CLI and JSON.", split_pending = 1 }
"codec.py" = { doc = "JSON in and out through `pydantic.TypeAdapter` over the model dataclasses (Decimal strings, ISO datetimes)." }
"schema.py" = { doc = "JSON Schema for the ledger and the result generated from the model, for `accounting schema`." }
"pricing.py" = { doc = "The `Pricing` protocol, the daily `TablePricing`, the policy-applying `Valuer`, recorded price answers and `PriceGap`." }
"cli.py" = { doc = "`accounting [--json] {run,validate,schema}` Typer app; findings in results, runtime failures exit 1, usage errors exit 2." }
"engine/__init__.py" = { doc = "Exposes `calculation` and re-exports `run` and `validate`." }
"engine/arithmetic.py" = { doc = "Exact finite-decimal sums and differences for conservation after bounded division." }
"engine/calculation.py" = { doc = "`run`: the engine over a ledger in time order, checking the cost identity after each group, then the open-lot rows, rounding and the journal; `Engine` books one event in the contract's order." }
"engine/checks.py" = { doc = "Structural checks that need no prices: invalid and duplicate events, dependencies, and links (unknown events, conflicts, mismatches)." }
"engine/core.py" = { doc = "The engine's state and booking primitives: lot keys, the exceptions report, market values, legs into lots, and the liability ledger." }
"engine/booking.py" = { doc = "Legs into lots with perpetual-compartment settlement shortfalls, income and expense flows, trades and perpetual fills." }
"engine/debt.py" = { doc = "Liabilities: borrowing, accrued and reversed interest, repayment and its liability side." }
"engine/opaque.py" = { doc = "Opaque positions (policy 05 rule 14): entries carrying basis, redemptions at market value with cost recovery, `performance` results, and the empty compartment." }
"engine/transfers.py" = { doc = "Transfers: linked pairs at carried basis, unlinked ones by their boundary basis, sides in opaque compartments routed to their positions, income before transfers." }
"engine/rollovers.py" = { doc = "Rollovers: atomic basis carries, with allocation by market value across several outputs." }
"engine/journal.py" = { doc = "The double-entry journal recorded as the engine books: lines per event on named accounts, balance checked, rounded lines with a `rounding` residue line." }
"engine/lots.py" = { doc = "`LotBook`: open lots per key, sign-crossing closes and FIFO/LIFO/HIFO/average consumption order." }
"engine/records.py" = { doc = "A lot book's records: the working `OpenLot`, `Consumed` and `Applied`, the HIFO rank, and exact allocation of a lot's origins." }
"engine/perps.py" = { doc = "Open perpetual positions on a settled basis: fill pairing, entry basis per `perp_cost_method`, realized P&L in the settlement asset." }
"engine/totals.py" = { doc = "A lot book's exact quantities: per-key running totals of quantity and basis, and the 1e-18 quantity net (policy 05 rule 20.3)." }
"engine/remaining.py" = { doc = "What the books hold at cost without prices: the cost identity after each group and the open-lot rows at `as_of`." }
"engine/operations.py" = { doc = "Structural checks and stable causal ordering for generic basis operations." }
"engine/rounding.py" = { doc = "Rounds money outputs to the minor unit by running total per journal account; the rows and open-lot rows restate the rounded lines." }
