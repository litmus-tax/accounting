name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks and tests (${{ matrix.python }})
    runs-on: [self-hosted, litmus]
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e './pkg[dev]'
      - run: python scripts/check.py
      - run: python -m pytest pkg/tests -q
