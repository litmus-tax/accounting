name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './pkg[dev]'
      - name: ruff
        run: |
          ruff check pkg/src pkg/tests
          ruff format --check pkg/src pkg/tests
      - name: pytest
        run: pytest pkg/tests -q
